{% extends "base.html" %}
{% block content %}
<div class="panel">
    <h2>Istoric comunicații</h2>
    <form method="get" class="filter">
        <select name="channel">
            {% for ch in channels %}
                <option value="{{ ch }}" {% if ch == selected_channel %}selected{% endif %}>{{ ch }}</option>
            {% endfor %}
        </select>
        <button>Filtrează</button>
    </form>

    <div class="history-list">
        {% for r in rows %}
            <div class="hist">
                <div><b>{{ r.callsign }}</b> <span>{{ r.unit }}</span> <em>{{ r.created_at }}</em></div>
                <p>{{ r.message }}</p>
            </div>
        {% else %}
            <p class="muted">Nu există mesaje pe acest canal.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
