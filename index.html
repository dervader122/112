<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Radio Operativ</title>
<style>
body{
margin:0;
font-family:Segoe UI,Arial;
background:#0d1117;
color:white;
overflow:hidden;
}
.topbar{
height:70px;
background:#161b22;
border-bottom:1px solid #30363d;
display:flex;
align-items:center;
padding:0 20px;
font-size:22px;
font-weight:bold;
}
.layout{
display:flex;
height:calc(100vh - 70px);
}
.sidebar{
width:280px;
background:#11161d;
border-right:1px solid #30363d;
padding:15px;
overflow:auto;
}
.channel{
padding:14px;
margin-bottom:8px;
background:#1b2430;
border:1px solid #30363d;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}
.channel:hover{
background:#2d3a4d;
}
.main{
flex:1;
display:flex;
flex-direction:column;
padding:20px;
}
.messages{
flex:1;
overflow:auto;
border:1px solid #30363d;
border-radius:14px;
padding:15px;
background:#11161d;
}
.msg{
background:#1b2430;
border:1px solid #30363d;
padding:12px;
border-radius:12px;
margin-bottom:10px;
}
.msg .top{
font-size:13px;
color:#9da7b3;
margin-bottom:5px;
}
.bottom{
margin-top:15px;
display:grid;
grid-template-columns:170px 1fr 130px;
gap:10px;
}
input{
background:#0d1117;
border:1px solid #30363d;
border-radius:12px;
padding:14px;
color:white;
outline:none;
}
button{
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}
#ptt{
background:#39485e;
color:white;
}
#ptt.active{
background:#c0392b;
box-shadow:0 0 20px rgba(255,0,0,.4);
}
.send{
background:#4a5d78;
color:white;
}
.login{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}
.loginbox{
width:400px;
background:#161b22;
border:1px solid #30363d;
border-radius:18px;
padding:30px;
}
.loginbox h2{
margin-top:0;
}
.loginbox input{
width:100%;
margin-bottom:12px;
}
.loginbox button{
width:100%;
padding:14px;
background:#4a5d78;
color:white;
}
.quick{
margin-top:20px;
}
.quick button{
width:100%;
padding:10px;
margin-bottom:7px;
background:#1b2430;
border:1px solid #30363d;
color:white;
text-align:left;
}
.status{
margin-top:20px;
padding:15px;
border-radius:15px;
background:#161b22;
border:1px solid #30363d;
}
</style>
</head>
<body>

<div class="login" id="login">
<div class="loginbox">
<h2>📻 Autentificare Sistem Radio</h2>
<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Parola">
<button onclick="loginSystem()">INTRĂ ÎN SISTEM</button>
</div>
</div>

<div class="topbar">
📻 SISTEM RADIO OPERATIV
</div>

<div class="layout">

<div class="sidebar">

<div class="channel">DISPECERAT GENERAL</div>
<div class="channel">SMURD</div>
<div class="channel">POMPIERI</div>
<div class="channel">POLIȚIE</div>
<div class="channel">AMBULANȚĂ</div>
<div class="channel">INTERVENȚII</div>

<div class="status">
<div><b>Operator:</b> <span id="operatorName">---</span></div>
<div style="margin-top:10px"><b>Status:</b> ACTIV</div>
</div>

<div class="quick">
<button onclick="quick('Cod 1 - Disponibil')">Cod 1 - Disponibil</button>
<button onclick="quick('Cod 2 - În deplasare')">Cod 2 - În deplasare</button>
<button onclick="quick('Cod 3 - Ajuns la caz')">Cod 3 - Ajuns la caz</button>
<button onclick="quick('Cod ROȘU - Urgență majoră')">Cod ROȘU</button>
</div>

</div>

<div class="main">

<div style="margin-bottom:15px">
<h2 style="margin:0">DISPECERAT GENERAL</h2>
<div style="color:#9da7b3">Canal radio activ</div>
</div>

<div class="messages" id="messages">

<div class="msg">
<div class="top">
<b>DISPECERAT-01</b> • Sistem • 18:00
</div>
<div>
Sistem radio pornit și funcțional.
</div>
</div>

</div>

<div class="bottom">
<button id="ptt">ȚINE APĂSAT PTT</button>
<input type="text" id="msgInput" placeholder="Scrie mesaj radio...">
<button class="send" onclick="sendMessage()">TRANSMITE</button>
</div>

</div>

</div>

<script>
let currentUser = "";
let pttActive = false;

function loginSystem(){
let u = document.getElementById("user").value.trim();
let p = document.getElementById("pass").value.trim();

if(u==="" || p===""){
alert("Completează datele.");
return;
}

currentUser = u;
document.getElementById("operatorName").innerText = u.toUpperCase();
document.getElementById("login").style.display = "none";
}

function sendMessage(){

let input = document.getElementById("msgInput");
let text = input.value.trim();

if(text==="") return;

let now = new Date();
let hour = String(now.getHours()).padStart(2,"0");
let minute = String(now.getMinutes()).padStart(2,"0");

let msg = document.createElement("div");
msg.className = "msg";

msg.innerHTML = `
<div class="top">
<b>${currentUser.toUpperCase()}</b> • Operator • ${hour}:${minute}
</div>
<div>
${pttActive ? "[PTT ACTIV] " : ""}${text}
</div>
`;

document.getElementById("messages").appendChild(msg);

input.value = "";

let box = document.getElementById("messages");
box.scrollTop = box.scrollHeight;
}

function quick(t){
document.getElementById("msgInput").value = t;
sendMessage();
}

document.getElementById("msgInput").addEventListener("keydown", function(e){
if(e.key==="Enter"){
sendMessage();
}
});

const ptt = document.getElementById("ptt");

ptt.addEventListener("mousedown", ()=>{
pttActive = true;
ptt.classList.add("active");
ptt.innerText = "TRANSMIȚI...";
});

ptt.addEventListener("mouseup", ()=>{
pttActive = false;
ptt.classList.remove("active");
ptt.innerText = "ȚINE APĂSAT PTT";
});
</script>

</body>
</html>
